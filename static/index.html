<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stocks Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <style>[x-cloak]{display:none!important}</style>
</head>
<body x-data="dashboard" x-cloak>

  <header class="top">
    <div class="brand">
      <h1>Stocks<span>Dashboard</span></h1>
      <p class="tag">free · ~15 min delayed · Yahoo Finance</p>
    </div>
    <div class="hud">
      <span class="status" :class="marketClass()">
        <i class="dot"></i><span x-text="marketLabel()"></span>
      </span>
      <span class="updated">⏱ <span x-text="lastUpdated"></span></span>
      <button class="iconbtn" @click="loadSnapshot()" :disabled="busy" title="Refresh quotes">↻</button>
    </div>
  </header>

  <!-- ── Watchlist strip ─────────────────────────────────────────── -->
  <section class="watch">
    <div class="strip">
      <template x-for="(q, i) in quotes" :key="i">
        <div class="card" :class="{active: selected===q.symbol}" @click="select(q.symbol)">
          <div class="card-top">
            <span class="sym" x-text="q.symbol"></span>
            <button class="x" @click.stop="removeSymbol(q.symbol)" title="Remove">✕</button>
          </div>
          <div class="nm" x-text="q.name"></div>
          <div class="sparkbox"><canvas class="spark" :data-sym="q.symbol"></canvas></div>
          <div class="px" x-text="fmtPrice(q.price)"></div>
          <div class="chg" :class="chgClass(q.change_pct)" x-text="fmtChg(q.change_pct)"></div>
          <div class="sma-legend">
            <template x-for="p in smaPeriods" :key="p">
              <span class="sma-item">
                <i class="dot" :style="'background:' + smaColors[p]"></i>
                <b x-text="p"></b>
                <em x-text="smaVal(q.symbol, p)"></em>
              </span>
            </template>
          </div>
        </div>
      </template>
      <form class="card add" @submit.prevent="addSymbol">
        <input x-model="adding" placeholder="Add ticker…" maxlength="10" autocomplete="off" spellcheck="false">
        <button type="submit" :disabled="busy">+</button>
      </form>
    </div>
    <p class="empty" x-show="!quotes.length && !busy">Loading watchlist…</p>
  </section>

  <!-- ── Selected underlying panel ───────────────────────────────── -->
  <template x-if="selected">
  <main>
    <div class="hero">
      <div class="hero-id">
        <h2 x-text="selected"></h2>
        <span class="nm" x-text="selName()"></span>
      </div>
      <div class="hero-px">
        <span class="big" x-text="fmtPrice(selPrice())"></span>
        <span class="chg big-chg" :class="chgClass(selQuote()?.change_pct)"
              x-text="fmtChg(selQuote()?.change_pct)"></span>
      </div>
      <div class="hero-stats">
        <div class="stat"><label>Day range</label><span x-text="fmtRange(selQuote()?.day_low, selQuote()?.day_high)"></span></div>
        <div class="stat"><label>Volume</label><span x-text="fmtNum(selQuote()?.volume)"></span></div>
        <div class="stat"><label>Div yield</label><span x-text="fmtPct(selQuote()?.dividend_yield)"></span></div>
        <div class="stat"><label>52w range</label><span x-text="fmtRange(selQuote()?.fifty_two_low, selQuote()?.fifty_two_high)"></span></div>
        <div class="stat"><label>Earnings</label><span x-text="fmtEarnings(selQuote()?.earnings_ts)"></span></div>
        <div class="stat"><label>1y target</label><span x-text="fmtPrice(selQuote()?.target_mean)"></span></div>
        <div class="stat"><label>Mom 1M</label><span :class="chgClass(mom(22))" x-text="fmtPct(mom(22))"></span></div>
        <div class="stat"><label>Mom 3M</label><span :class="chgClass(mom(63))" x-text="fmtPct(mom(63))"></span></div>
        <div class="stat"><label>Mom 6M</label><span :class="chgClass(mom(126))" x-text="fmtPct(mom(126))"></span></div>
        <div class="stat"><label>Mom 1Y</label><span :class="chgClass(mom(252))" x-text="fmtPct(mom(252))"></span></div>
      </div>
    </div>

    <!-- News -->
    <section class="panel" x-show="news.length">
      <div class="panel-head">
        <h3>News</h3>
        <span class="hint" x-text="news.length ? news.length + ' headlines' : ''"></span>
      </div>
      <div class="news">
        <template x-for="(n, i) in news" :key="i">
          <a class="news-item" :href="n.link" target="_blank" rel="noopener">
            <span class="news-title" x-text="n.title"></span>
            <span class="news-meta" x-text="n.ts ? fmtNewsDate(n.ts) : ''"></span>
          </a>
        </template>
      </div>
    </section>
    <p class="empty" x-show="selected && !news.length"
       x-text="newsLoading ? 'Loading news…' : 'No recent headlines.'"></p>

    <!-- Expirations + chain + analysis charts removed for now (backend intact). -->
  </main>
  </template>

  <footer>
    <p>Data: Yahoo Finance · quotes ≈15 min delayed · free · not investment advice</p>
  </footer>

  <script src="/static/app.js?v=7" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</body>
</html>
